<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>簡易聊天室（前端）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f2f3f5;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #connection-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    color: white;
    z-index: 10;
  }
  #connection-banner.connecting { background: #f5a623; }
  #connection-banner.connected { background: #2ecc71; }
  #connection-banner.error { background: #e74c3c; }

  #login-screen {
    background: white;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    width: 320px;
    text-align: center;
  }
  #login-screen h1 { font-size: 20px; margin-bottom: 8px; color: #222; }
  #login-screen p.hint { font-size: 12px; color: #999; margin-bottom: 20px; word-break: break-all; }
  #login-screen input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 15px;
    margin-bottom: 12px;
  }
  #login-screen button, #chat-form button {
    background: #4b6bfb;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
  }
  #login-screen button:disabled { background: #ccc; cursor: not-allowed; }
  #login-screen button:hover:not(:disabled) { background: #3a56d4; }

  #chat-screen {
    display: none;
    width: 420px;
    height: 640px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    overflow: hidden;
    flex-direction: column;
  }
  #chat-header {
    background: #4b6bfb;
    color: white;
    padding: 16px;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #online-count { font-size: 12px; opacity: 0.85; }

  #messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #fafbfc;
  }

  .msg-bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }
  .msg-bubble.me {
    align-self: flex-end;
    background: #4b6bfb;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg-bubble.other {
    align-self: flex-start;
    background: #eef0f4;
    color: #222;
    border-bottom-left-radius: 4px;
  }
  .msg-user { font-size: 11px; color: #888; margin-bottom: 2px; }
  .msg-system {
    align-self: center;
    font-size: 12px;
    color: #999;
    padding: 4px 10px;
    background: #eee;
    border-radius: 10px;
  }

  #chat-form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #eee;
  }
  #chat-form input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 14px;
  }
  #chat-form button { width: auto; padding: 12px 18px; }
</style>
</head>
<body>

  <div id="connection-banner" class="connecting">正在連線到後端伺服器...</div>

  <!-- 登入畫面 -->
  <div id="login-screen">
    <h1>💬 進入聊天室</h1>
    <p class="hint">後端伺服器：<span id="backend-url-display"></span></p>
    <input id="username-input" type="text" placeholder="輸入你的暱稱" maxlength="20" />
    <button id="join-btn" disabled>連線中，請稍候...</button>
  </div>

  <!-- 聊天畫面 -->
  <div id="chat-screen">
    <div id="chat-header">
      <span id="room-title">聊天室</span>
      <span id="online-count">線上 0 人</span>
    </div>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="message-input" type="text" placeholder="輸入訊息..." autocomplete="off" />
      <button type="submit">送出</button>
    </form>
  </div>

  <!-- 先載入設定檔，決定要連去哪個後端 -->
  <script src="config.js"></script>
  <!-- 從 CDN 載入 socket.io 客戶端函式庫 (因為前後端不同網址，不能用相對路徑載入) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const banner = document.getElementById("connection-banner");
    const backendUrlDisplay = document.getElementById("backend-url-display");
    const joinBtn = document.getElementById("join-btn");
    backendUrlDisplay.textContent = window.BACKEND_URL;

    // 連到 config.js 裡設定的後端網址
    const socket = io(window.BACKEND_URL, {
      reconnectionAttempts: 5,
    });

    socket.on("connect", () => {
      banner.className = "connected";
      banner.textContent = "✅ 已連線到後端伺服器";
      joinBtn.disabled = false;
      joinBtn.textContent = "加入聊天室";
      setTimeout(() => { banner.style.display = "none"; }, 1500);
    });

    socket.on("connect_error", (err) => {
      banner.className = "error";
      banner.textContent = "❌ 連不到後端伺服器，請確認後端是否已啟動、網址是否正確";
      joinBtn.disabled = true;
      joinBtn.textContent = "無法連線";
      console.error("連線錯誤:", err.message);
    });

    const loginScreen = document.getElementById("login-screen");
    const chatScreen = document.getElementById("chat-screen");
    const usernameInput = document.getElementById("username-input");
    const messagesEl = document.getElementById("messages");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message-input");
    const onlineCountEl = document.getElementById("online-count");

    let myName = "";

    function joinChat() {
      const name = usernameInput.value.trim();
      if (!name || joinBtn.disabled) {
        usernameInput.focus();
        return;
      }
      myName = name;
      socket.emit("join", name);
      loginScreen.style.display = "none";
      chatScreen.style.display = "flex";
      messageInput.focus();
    }

    joinBtn.addEventListener("click", joinChat);
    usernameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") joinChat(); });

    function renderChatMessage(msg) {
      const bubble = document.createElement("div");
      const isMe = msg.user === myName;
      bubble.className = "msg-bubble " + (isMe ? "me" : "other");

      if (!isMe) {
        const userLabel = document.createElement("div");
        userLabel.className = "msg-user";
        userLabel.textContent = msg.user;
        bubble.appendChild(userLabel);
      }

      const textEl = document.createElement("div");
      textEl.textContent = msg.text;
      bubble.appendChild(textEl);
      messagesEl.appendChild(bubble);
    }

    function renderSystemMessage(msg) {
      const el = document.createElement("div");
      el.className = "msg-system";
      el.textContent = msg.text;
      messagesEl.appendChild(el);
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    socket.on("history", (history) => {
      messagesEl.innerHTML = "";
      history.forEach((msg) => {
        if (msg.type === "chat") renderChatMessage(msg);
        else renderSystemMessage(msg);
      });
      scrollToBottom();
    });

    socket.on("chat message", (msg) => {
      renderChatMessage(msg);
      scrollToBottom();
    });

    socket.on("system message", (msg) => {
      renderSystemMessage(msg);
      scrollToBottom();
    });

    socket.on("online users", (users) => {
      onlineCountEl.textContent = `線上 ${users.length} 人`;
    });

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      socket.emit("chat message", text);
      messageInput.value = "";
    });
  </script>
</body>
</html>
